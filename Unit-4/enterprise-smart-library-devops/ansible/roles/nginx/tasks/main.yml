---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Install Smart Library reverse-proxy configuration
  ansible.builtin.template:
    src: library.conf.j2
    dest: /etc/nginx/sites-available/library.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/library.conf
    dest: /etc/nginx/sites-enabled/library.conf
    state: link
  notify: Validate and reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload nginx
