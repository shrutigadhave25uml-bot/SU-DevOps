---
- name: Install Docker from Ubuntu repository
  ansible.builtin.apt:
    name:
      - docker.io
      - containerd
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker SDK for Python
  ansible.builtin.apt:
    name: python3-docker
    state: present
