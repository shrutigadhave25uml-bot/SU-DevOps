---
- name: Configure Enterprise Smart Library host
  hosts: library_servers
  become: true
  vars:
    app_image: "{{ lookup('env', 'APP_IMAGE') | default('REPLACE_WITH_YOUR_LIBRARY_APP_IMAGE', true) }}"
    app_container_port: 5000
    health_path: "/api/health"
  roles:
    - common
    - docker
    - nginx
    - library_app
