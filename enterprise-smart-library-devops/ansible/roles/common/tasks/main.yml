---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common utilities and Python
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - python3
      - python3-pip
      - ufw
    state: present

- name: Allow SSH in UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP in UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
